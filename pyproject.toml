[project]
name = "fracture"
version = "0.1.0"
description = "Fracture Systems Consolidator Platform"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
orchestration = ["dagster>=1.9", "dagster-webserver>=1.9"]
transform = ["dbt-core>=1.8", "dbt-postgres>=1.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "faker>=30.0"]

[project.scripts]
fracture = "fracture.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fracture = ["**/*.sql", "**/*.yml", "**/*.yaml", "**/*.json", "**/*.md", "**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a live Postgres cluster",
    "slow: long-running end-to-end test",
]
