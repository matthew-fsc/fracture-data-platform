# Local environment (spec section 10): Postgres plus the synthetic tenant
# generator. MinIO stands in for S3 so the artifact key layout is exercised
# the same way locally as in production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fracture
      POSTGRES_PASSWORD: fracture
      POSTGRES_DB: fracture_control
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fracture -d fracture_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fracture
      MINIO_ROOT_PASSWORD: fracture-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
